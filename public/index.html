<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#efece6" />
  <meta name="description" content="橱窗选衣 · 一键 AI 试穿，看到衣服穿在自己身上的效果" />
  <title>搭配试穿间 · AI 虚拟试穿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/style-wardrobe.css" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
</head>

<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="sidebar__brand">
        <span class="brand__mark" aria-hidden="true">试</span>
        <span class="brand__name">搭配试穿间</span>
        <span class="demo-badge" id="demo-badge" hidden>演示</span>
      </div>

      <nav class="nav" id="nav">
        <div class="nav__group" data-group="pick">
          <button type="button" class="nav__group-title" aria-expanded="true">
            <span>选衣</span>
            <span class="nav__chev" aria-hidden="true">▾</span>
          </button>
          <div class="nav__items">
            <button type="button" class="nav__item" data-route="shop">橱窗</button>
            <button type="button" class="nav__item" data-route="wardrobe">我的衣橱</button>
          </div>
        </div>
        <div class="nav__group" data-group="studio">
          <button type="button" class="nav__group-title" aria-expanded="true">
            <span>工作台</span>
            <span class="nav__chev" aria-hidden="true">▾</span>
          </button>
          <div class="nav__items">
            <button type="button" class="nav__item" data-route="studio">搭配工作台</button>
            <button type="button" class="nav__item" data-route="settings">设置</button>
          </div>
        </div>
        <div class="nav__group" data-group="account">
          <button type="button" class="nav__group-title" aria-expanded="true">
            <span>我的</span>
            <span class="nav__chev" aria-hidden="true">▾</span>
          </button>
          <div class="nav__items">
            <button type="button" class="nav__item" data-route="me">订单与说明</button>
          </div>
        </div>
      </nav>

      <div class="sidebar__foot">
        <div class="balance-box" id="balance-box">
          <span class="balance-box__label">余额</span>
          <span class="balance-box__value" id="balance-value">—</span>
        </div>
        <p class="sidebar__note">试穿结果为 AI 生成，仅供参考</p>
      </div>
    </aside>

    <main id="main" class="view-root" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/app.js"></script>
</body>

</html>
