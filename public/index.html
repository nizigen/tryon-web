<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="橱窗选衣 · 一键 AI 试穿，看到衣服穿在自己身上的效果" />
  <title>穿搭试穿间 · AI 虚拟试穿</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
</head>

<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">试</span>
        <span class="brand__name">穿搭试穿间</span>
      </div>
      <nav class="tabs" aria-label="主导航">
        <button type="button" class="tab is-active" data-route="shop" aria-current="page">橱窗</button>
        <button type="button" class="tab" data-route="me">我的</button>
      </nav>
      <button type="button" class="chip chip--balance" id="balance-chip" title="试穿余额">
        <span class="chip__label">余额</span>
        <span class="chip__value" id="balance-value">—</span>
      </button>
    </div>
    <div class="topbar__notice" id="gateway-notice" hidden role="status"></div>
  </header>

  <main id="main" class="view-root" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/app.js"></script>
</body>

</html>
